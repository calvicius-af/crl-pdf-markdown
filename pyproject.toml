[project]
name = "crl-pdf-markdown"
version = "0.1.0"
description = "PDF → Docling → Markdown para importação no MAXQDA"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "António Fula"}]
dependencies = ["docling>=2.128,<3", "markdown-it-py>=3,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
crl-md = "crl_markdown.cli:main"
crl-md-app = "crl_markdown.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

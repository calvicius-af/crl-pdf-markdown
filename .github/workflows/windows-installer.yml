name: Instalador Windows completo
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'packaging/windows/**'
      - 'scripts/**'
      - 'src/**'
      - 'requirements/**'
      - 'pyproject.toml'
      - 'docs/operacao/instalacao-windows.md'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      PIP_CONSTRAINT: ${{ github.workspace }}/requirements/offline-windows-py313.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Preparar bibliotecas e modelos (só na construção)
        shell: pwsh
        run: |
          python -m pip install . -c requirements/runtime.txt
          if ($LASTEXITCODE -ne 0) { throw 'Falha a preparar bibliotecas' }
          python -m crl_markdown models download --dest "$env:RUNNER_TEMP\modelos"
          if ($LASTEXITCODE -ne 0) { throw 'Falha a preparar modelos' }
          python scripts/preparar_offline.py --saida "$env:RUNNER_TEMP\pacote" --modelos "$env:RUNNER_TEMP\modelos"
          if ($LASTEXITCODE -ne 0) { throw 'Falha a preparar wheels' }
          python scripts/montar_windows.py --pacote "$env:RUNNER_TEMP\pacote" --saida "$env:RUNNER_TEMP\payload-original"
          if ($LASTEXITCODE -ne 0) { throw 'Falha a montar runtime' }
      - name: Ensaiar runtime deslocado com origem L e sockets bloqueados
        shell: pwsh
        run: |
          # D: do runner não fornece aliases curtos; acentos são ensaiados
          # separadamente no destino C: com a verificação do instalador.
          $payload = "$env:RUNNER_TEMP\CRL runtime com espacos"
          Move-Item "$env:RUNNER_TEMP\payload-original" $payload
          New-Item -ItemType Directory "$env:RUNNER_TEMP\origem" | Out-Null
          Copy-Item "$payload\recursos\smoke.pdf" "$env:RUNNER_TEMP\origem\smoke.pdf"
          subst L: "$env:RUNNER_TEMP\origem"
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível criar L:' }
          try {
            & "$payload\python\python.exe" -I -X utf8 -B -m crl_markdown.release_check --source L:\smoke.pdf --out "$env:RUNNER_TEMP\evidencia-runtime"
            if ($LASTEXITCODE -ne 0) { throw 'Falhou o runtime deslocado' }
          } finally { subst L: /D }
          "CRL_PAYLOAD=$payload" >> $env:GITHUB_ENV
      - name: Compilar um único instalador
        shell: pwsh
        run: |
          $version = python -c "from crl_markdown import __version__; print(__version__)"
          $binaryVersion = python -c "import re; from crl_markdown import __version__; print('.'.join(re.findall(r'\d+', __version__)[:4]))"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 não está instalado no construtor' }
          & $iscc "/DPayload=$env:CRL_PAYLOAD" "/DAppVersion=$version" "/DBinaryVersion=$binaryVersion" "/DOutput=$env:RUNNER_TEMP\instalador" packaging/windows/CRL.iss
          if ($LASTEXITCODE -ne 0) { throw 'Falhou a compilação do instalador' }
          $installers = @(Get-ChildItem "$env:RUNNER_TEMP\instalador\*.exe")
          if ($installers.Count -ne 1) { throw 'Esperava-se exatamente um instalador' }
          if (Get-ChildItem "$env:RUNNER_TEMP\instalador\*.bin") { throw 'O instalador tem partes externas' }
          $hash = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installers[0].Name)" | Set-Content "$env:RUNNER_TEMP\instalador\SHA256SUMS.txt" -Encoding utf8
          $signatures = foreach ($binary in @($installers[0].FullName, "$env:CRL_PAYLOAD\python\python.exe", "$env:CRL_PAYLOAD\python\pythonw.exe")) {
            $signature = Get-AuthenticodeSignature $binary
            [PSCustomObject]@{
              file = Split-Path $binary -Leaf
              status = [string]$signature.Status
              publisher = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { $null }
              sha256 = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLower()
            }
          }
          $signatures | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\instalador\ASSINATURAS.json" -Encoding utf8
      - name: Instalar e testar o EXE compilado
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:RUNNER_TEMP\instalador\*.exe"
          $destination = "$env:LOCALAPPDATA\CRL ensaio com espaços"
          $process = Start-Process $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"", "/LOG=`"$env:RUNNER_TEMP\instalacao.log`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Falhou a instalação do EXE' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Abrir CRL.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Falta o atalho Abrir CRL' }
          # O atalho usa pythonw: testar também sem stdout/stderr de consola.
          $check = Start-Process "$destination\python\pythonw.exe" -ArgumentList '-I', '-X', 'utf8', '-B', '-m', 'crl_markdown.release_check', '--out', "`"$env:RUNNER_TEMP\evidencia-instalacao`"" -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Falhou a conversão sem consola após instalar o EXE' }
          "CRL_DESTINO=$destination" >> $env:GITHUB_ENV
      - name: Ensaio de ponta a ponta numa pasta como a da estação CRL
        shell: pwsh
        run: |
          # Converter, reauditar, OCR numa página, falso alarme e aprovação na
          # janela de revisão, correção com o PDF ao lado, aprovação em lote,
          # entrega e cópia de revisão. A pasta de saída tem o nome longo,
          # acentuado e com espaços da pasta sincronizada da estação.
          python scripts/amostra_ensaio.py --saida "$env:RUNNER_TEMP\amostra" --smoke "$env:CRL_DESTINO\recursos\smoke.pdf"
          if ($LASTEXITCODE -ne 0) { throw 'Falhou a preparação da amostra' }
          $run = Start-Process "$env:CRL_DESTINO\python\pythonw.exe" -ArgumentList '-I', '-X', 'utf8', '-B', '-m', 'crl_markdown.ensaio_completo', '--pdfs', "`"$env:RUNNER_TEMP\amostra`"", '--out', "`"$env:RUNNER_TEMP\ensaio`"" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\ensaio\ensaio_completo.json" -ErrorAction SilentlyContinue
          if ($run.ExitCode -ne 0) { throw 'Falhou o ensaio de ponta a ponta' }
      - name: Pacote de atualização aplicado pelo ficheiro Atualizar CRL.cmd
        shell: pwsh
        run: |
          & "$env:CRL_DESTINO\python\python.exe" -I -X utf8 -B -m crl_markdown.atualizacao --criar "$env:RUNNER_TEMP\atualizacao"
          if ($LASTEXITCODE -ne 0) { throw 'Falhou a criação do pacote de atualização' }
          Copy-Item 'packaging/windows/Atualizar CRL.cmd' "$env:RUNNER_TEMP\atualizacao\"
          # O .cmd procura a instalação em LOCALAPPDATA\Programs\CRL-PDF-Markdown,
          # como na estação: uma junção aponta para a instalação do ensaio.
          $fake = "$env:RUNNER_TEMP\localappdata"
          New-Item -ItemType Directory "$fake\Programs\CRL-PDF-Markdown" | Out-Null
          New-Item -ItemType Junction -Path "$fake\Programs\CRL-PDF-Markdown\0.4.0rc3" -Target $env:CRL_DESTINO | Out-Null
          $env:LOCALAPPDATA = $fake
          cmd /c "echo.| `"$env:RUNNER_TEMP\atualizacao\Atualizar CRL.cmd`""
          if ($LASTEXITCODE -ne 0) { throw 'Falhou a aplicação do pacote de atualização' }
          $distribution = Get-Content "$env:CRL_DESTINO\distribuicao.json" -Raw | ConvertFrom-Json
          if (-not $distribution.atualizacoes) { throw 'A atualização não ficou registada' }
          $check = Start-Process "$env:CRL_DESTINO\python\pythonw.exe" -ArgumentList '-I', '-X', 'utf8', '-B', '-m', 'crl_markdown.release_check', '--out', "`"$env:RUNNER_TEMP\evidencia-atualizacao`"" -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Falhou o ensaio da instalação depois da atualização' }
          Get-ChildItem "$env:RUNNER_TEMP\atualizacao\*.zip" | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Set-Content "$env:RUNNER_TEMP\atualizacao\SHA256SUMS.txt" -Encoding utf8
          }
      - name: Guardar pacote de atualização
        uses: actions/upload-artifact@v4
        with:
          name: pacote-atualizacao
          path: ${{ runner.temp }}/atualizacao/
          if-no-files-found: error
          retention-days: 30
      - name: Guardar instalador candidato
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows-candidato
          path: ${{ runner.temp }}/instalador/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Guardar evidência (também em caso de falha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-instalador-windows
          path: |
            ${{ runner.temp }}/evidencia-runtime/
            ${{ runner.temp }}/evidencia-instalacao/
            ${{ runner.temp }}/evidencia-atualizacao/
            ${{ runner.temp }}/ensaio/ensaio_completo.json
            ${{ runner.temp }}/ensaio/**/_auditoria/*.md
            ${{ runner.temp }}/ensaio/**/_auditoria/relatorio.txt
            ${{ runner.temp }}/instalacao.log
            ${{ runner.temp }}/pacote/falha.txt
          if-no-files-found: warn

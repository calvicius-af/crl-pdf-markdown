name: Instalador Windows completo
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'packaging/windows/**'
      - 'scripts/**'
      - 'src/**'
      - 'requirements/**'
      - 'pyproject.toml'
      - 'docs/operacao/instalacao-windows.md'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PIP_CONSTRAINT: ${{ github.workspace }}/requirements/offline-windows-py313.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Preparar bibliotecas e modelos (só na construção)
        shell: pwsh
        run: |
          python -m pip install . -c requirements/runtime.txt
          if ($LASTEXITCODE -ne 0) { throw 'Falha a preparar bibliotecas' }
          python -m crl_markdown models download --dest "$env:RUNNER_TEMP\modelos"
          if ($LASTEXITCODE -ne 0) { throw 'Falha a preparar modelos' }
          python scripts/preparar_offline.py --saida "$env:RUNNER_TEMP\pacote" --modelos "$env:RUNNER_TEMP\modelos"
          if ($LASTEXITCODE -ne 0) { throw 'Falha a preparar wheels' }
          python scripts/montar_windows.py --pacote "$env:RUNNER_TEMP\pacote" --saida "$env:RUNNER_TEMP\payload-original"
          if ($LASTEXITCODE -ne 0) { throw 'Falha a montar runtime' }
      - name: Ensaiar runtime deslocado com origem L e sockets bloqueados
        shell: pwsh
        run: |
          $payload = "$env:RUNNER_TEMP\Distribuição CRL com espaços"
          Move-Item "$env:RUNNER_TEMP\payload-original" $payload
          New-Item -ItemType Directory "$env:RUNNER_TEMP\origem" | Out-Null
          Copy-Item "$payload\recursos\smoke.pdf" "$env:RUNNER_TEMP\origem\smoke.pdf"
          subst L: "$env:RUNNER_TEMP\origem"
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível criar L:' }
          try {
            & "$payload\python\python.exe" -I -X utf8 -B -m crl_markdown.release_check --source L:\smoke.pdf --out "$env:RUNNER_TEMP\evidencia-runtime"
            if ($LASTEXITCODE -ne 0) { throw 'Falhou o runtime deslocado' }
          } finally { subst L: /D }
          "CRL_PAYLOAD=$payload" >> $env:GITHUB_ENV
      - name: Compilar um único instalador
        shell: pwsh
        run: |
          $version = python -c "from crl_markdown import __version__; print(__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 não está instalado no construtor' }
          & $iscc "/DPayload=$env:CRL_PAYLOAD" "/DAppVersion=$version" "/DOutput=$env:RUNNER_TEMP\instalador" packaging/windows/CRL.iss
          if ($LASTEXITCODE -ne 0) { throw 'Falhou a compilação do instalador' }
          $installers = @(Get-ChildItem "$env:RUNNER_TEMP\instalador\*.exe")
          if ($installers.Count -ne 1) { throw 'Esperava-se exatamente um instalador' }
          if (Get-ChildItem "$env:RUNNER_TEMP\instalador\*.bin") { throw 'O instalador tem partes externas' }
          $hash = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installers[0].Name)" | Set-Content "$env:RUNNER_TEMP\instalador\SHA256SUMS.txt" -Encoding utf8
      - name: Instalar e testar o EXE compilado
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:RUNNER_TEMP\instalador\*.exe"
          $destination = "$env:LOCALAPPDATA\CRL ensaio com espaços"
          $process = Start-Process $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$destination`"", "/LOG=`"$env:RUNNER_TEMP\instalacao.log`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Falhou a instalação do EXE' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Abrir CRL.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Falta o atalho Abrir CRL' }
          # O atalho usa pythonw: testar também sem stdout/stderr de consola.
          $check = Start-Process "$destination\python\pythonw.exe" -ArgumentList '-I', '-X', 'utf8', '-B', '-m', 'crl_markdown.release_check', '--out', "`"$env:RUNNER_TEMP\evidencia-instalacao`"" -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Falhou a conversão sem consola após instalar o EXE' }
      - name: Guardar instalador candidato
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows-candidato
          path: ${{ runner.temp }}/instalador/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Guardar evidência (também em caso de falha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-instalador-windows
          path: |
            ${{ runner.temp }}/evidencia-runtime/
            ${{ runner.temp }}/evidencia-instalacao/
            ${{ runner.temp }}/instalacao.log
            ${{ runner.temp }}/pacote/falha.txt
          if-no-files-found: warn

name: Ensaio de pacote offline Windows
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/offline.yml'
      - 'scripts/*offline*'
      - 'scripts/Instalar_CRL.bat'
      - 'requirements/**'
      - 'src/crl_markdown/models.py'
      - 'pyproject.toml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PIP_CONSTRAINT: ${{ github.workspace }}/requirements/offline-windows-py313.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements/runtime.txt
            requirements/offline-windows-py313.txt
      - name: Confirmar caminho local do utilizador com acentos
        run: |
          $destination = Join-Path $env:LOCALAPPDATA 'Instalação CRL com espaços'
          "CRL_OFFLINE_DEST=$destination" >> $env:GITHUB_ENV
          $probe = @'
          import importlib.util, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('installer', 'scripts/instalar_offline.py')
          installer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(installer)
          packages = Path(sys.argv[1]) / 'prova' / 'Lib/site-packages'
          packages.mkdir(parents=True)
          alias = installer.windows_ascii_path(packages)
          print('Pasta original:', packages)
          print('Alias nativo:', alias)
          assert str(alias).isascii() and alias.samefile(packages)
          '@
          $probe | python - $destination
          if ($LASTEXITCODE -ne 0) { throw 'O destino de ensaio não tem alias nativo seguro' }
      - name: Preparar runtime e modelos com rede
        run: |
          python -m pip install . -c requirements/runtime.txt
          python -m crl_markdown models download --dest "$env:RUNNER_TEMP\Modelos CRL"
      - name: Preparar pacote completo com versões e hashes
        run: |
          python scripts/preparar_offline.py --saida "$env:RUNNER_TEMP\Pacote CRL com espaços" --modelos "$env:RUNNER_TEMP\Modelos CRL"
      - name: Instalar de pacote só de leitura e executar conversão sem sockets
        run: |
          $package = "$env:RUNNER_TEMP\Pacote CRL com espaços"
          $destination = $env:CRL_OFFLINE_DEST
          # W inclui SYNCHRONIZE, necessário também para abrir em leitura.
          # Negar apenas escrita/apagamento conserva a leitura do instalador.
          icacls $package /deny "$($env:USERNAME):(OI)(CI)(WD,AD,WEA,WA,DE,DC)"
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível tornar o pacote só de leitura" }
          $probe = @'
          import sys
          from pathlib import Path
          package = Path(sys.argv[1])
          (package / 'instalar_offline.py').read_bytes()
          for name, mode in [('prova-escrita.tmp', 'xb'), ('pacote.json', 'ab')]:
              try:
                  with (package / name).open(mode):
                      pass
              except PermissionError:
                  continue
              raise RuntimeError('A pasta de ensaio permite escrita: ' + name)
          print('Pacote legível; criação e alteração de ficheiros recusadas.')
          '@
          $probe | python - $package
          if ($LASTEXITCODE -ne 0) { throw "A proteção de leitura do pacote não ficou demonstrada" }
          python "$package\instalar_offline.py" --destination $destination
          if ($LASTEXITCODE -ne 0) { throw "A instalação offline falhou" }
          $config = Get-Content "$destination\instalacao.json" -Raw | ConvertFrom-Json
          & $config.python -m crl_markdown doctor --models $config.models --out "$destination\assistencia\doctor"
          if ($LASTEXITCODE -ne 0) { throw "Doctor encontrou problemas na instalação" }
          if (-not $config.ocr_tested) { throw "Este ensaio exige modelos OCR completos" }
      - name: Reunir evidência pequena do ensaio
        if: always()
        run: |
          $evidence = "$env:RUNNER_TEMP\Evidencia CRL"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          if ($env:CRL_OFFLINE_DEST) {
            if (Test-Path "$env:CRL_OFFLINE_DEST\assistencia") {
              Copy-Item "$env:CRL_OFFLINE_DEST\assistencia" $evidence -Recurse
            }
            if (Test-Path "$env:CRL_OFFLINE_DEST\instalacao.json") {
              Copy-Item "$env:CRL_OFFLINE_DEST\instalacao.json" $evidence
            }
          }
          foreach ($name in @('pacote.json', 'requirements.install.txt', 'preparacao.txt', 'falha.txt')) {
            $file = Join-Path "$env:RUNNER_TEMP\Pacote CRL com espaços" $name
            if (Test-Path $file) { Copy-Item $file $evidence }
          }
      - name: Guardar evidência pequena do ensaio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-offline-windows-py313
          if-no-files-found: warn
          path: ${{ runner.temp }}/Evidencia CRL/
      - name: Disponibilizar pacote completo para teste
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CRL-offline-0.3.1rc2-windows-x64-py313
          path: ${{ runner.temp }}/Pacote CRL com espaços/
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

name: Markdown pipeline
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Testes sem modelos/PyTorch; integração com objetos Docling reais.
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install pytest ruff 'markdown-it-py>=3,<5' 'docling-core>=2.97,<3' 'pdfplumber>=0.11' 'jsonschema>=4' 'openpyxl>=3.1,<4'
      - run: python -m pytest --junitxml=pytest-results.xml
      - name: Report failed tests
        if: failure()
        run: python scripts/report_pytest.py pytest-results.xml
      - run: ruff check src tests
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint:md
